# docs/DESIGN.md §10.4. Third-party actions are pinned to commit SHAs (the
# version is in the comment) so a moved tag can't change what runs here.

name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (lint, test, vulnerabilities, licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check generated code is current
        run: make generate && git diff --exit-code
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-mode: goinstall # built with our Go toolchain
      - run: make test
      - name: Tested restore (back up, restore into a fresh instance, compare)
        run: scripts/restore-test.sh
      - run: make vuln
      - run: make licenses-go

  web:
    name: Web (typecheck, build, licenses, audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build # includes the TypeScript typecheck
      - run: node ../scripts/check-npm-licenses.mjs
      - run: npm audit --audit-level=high

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make build
      - name: Install browsers
        working-directory: web
        run: npx playwright install --with-deps chromium webkit
      - name: Run Playwright
        working-directory: web
        run: npx playwright test
      # Synthetic data only in CI, so the report is safe to keep briefly.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  secrets:
    name: Secret scan (betterleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history
      - name: Install betterleaks
        env:
          VERSION: 1.10.0
          SHA256: 9d9ad503cd5d80d18a939352266c3fcca52f10da9b83cd5cfe646989b13940fe
        run: |
          f="betterleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/betterleaks/betterleaks/releases/download/v${VERSION}/${f}"
          echo "${SHA256}  ${f}" | sha256sum --check
          tar -xzf "$f" betterleaks
          sudo install betterleaks /usr/local/bin/
      - run: betterleaks git --redact --no-banner .

  image:
    name: Container image (linux/amd64 + linux/arm64)
    needs: [go, web, e2e, secrets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # only used on tag pushes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
