apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chrysalis
  annotations:
    # Forward-auth to Authelia (adjust the service address to your install).
    nginx.ingress.kubernetes.io/auth-method: GET
    nginx.ingress.kubernetes.io/auth-url: http://authelia.authelia.svc.cluster.local/api/authz/auth-request
    nginx.ingress.kubernetes.io/auth-signin: https://auth.example.com?rm=$request_method
    nginx.ingress.kubernetes.io/auth-response-headers: Remote-User,Remote-Name,Remote-Groups,Remote-Email
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 30m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [board.example.home]
      secretName: chrysalis-tls
  rules:
    - host: board.example.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chrysalis
                port:
                  name: http
