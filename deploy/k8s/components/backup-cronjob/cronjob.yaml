apiVersion: batch/v1
kind: CronJob
metadata:
  name: chrysalis-backup
  labels:
    app.kubernetes.io/name: chrysalis-backup
    app.kubernetes.io/part-of: chrysalis
spec:
  schedule: "0 3 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: chrysalis-backup
            app.kubernetes.io/part-of: chrysalis
        spec:
          restartPolicy: OnFailure
          serviceAccountName: chrysalis
          automountServiceAccountToken: false
          # ReadWriteOnce: only pods on the node that has the volume attached
          # can mount it, so run next to the Chrysalis pod.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: chrysalis
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: ghcr.io/runlevel-six/chrysalis:latest # overlays set the tag
              args: [admin, backup]
              envFrom:
                - configMapRef:
                    name: chrysalis-config
                - secretRef:
                    name: chrysalis-secrets
                    optional: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: chrysalis-data
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
