# OPTIONAL: back up with a Kubernetes CronJob instead of the server's built-in
# daily schedule. Most clusters don't need this; see
# docs/how-to/back-up-and-restore.md for the trade-off.
#
# Add it to an overlay:
#
#   components:
#     - ../../components/backup-cronjob
#
# It turns the built-in schedule off and runs `chrysalis admin backup` at
# 03:00 every day in a pod that mounts the same volume. The volume is
# ReadWriteOnce, which lets pods share it only on the same node, so the job
# is pinned to the node running the Chrysalis pod. If your storage class
# supports ReadWriteMany you can drop that affinity.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - cronjob.yaml
  - networkpolicy.yaml
patches:
  - target: { kind: ConfigMap, name: chrysalis-config }
    patch: |-
      - op: replace
        path: /data/CHRYSALIS_BACKUP_SCHEDULE
        value: "off"
