apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrysalis
spec:
  # SQLite on a ReadWriteOnce volume means one replica, and Recreate so the
  # old pod releases the volume before the new one starts.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chrysalis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chrysalis
    spec:
      serviceAccountName: chrysalis
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: chrysalis
          image: chrysalis
          args: [serve]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: chrysalis-config
            # OIDC client secret etc. Created by the overlay; never committed.
            - secretRef:
                name: chrysalis-secrets
                optional: true
          startupProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chrysalis-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
