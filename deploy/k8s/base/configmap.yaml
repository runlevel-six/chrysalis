# Non-secret settings. Overlays patch in at least CHRYSALIS_BASE_URL and the
# auth settings. Every variable is listed in docs/DESIGN.md §11.
apiVersion: v1
kind: ConfigMap
metadata:
  name: chrysalis-config
data:
  CHRYSALIS_DATA_DIR: /data
  CHRYSALIS_LISTEN_ADDR: ":8080"
  CHRYSALIS_AUTH_MODE: oidc
  # Daily backups into /data/backups (7 daily and 4 weekly copies kept). The
  # example overlays add ../../components/backup-cronjob, which runs them as a
  # Kubernetes CronJob and turns this built-in schedule off. Without that
  # component, the server backs itself up.
  CHRYSALIS_BACKUP_SCHEDULE: daily
