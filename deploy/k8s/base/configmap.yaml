# Non-secret settings. Overlays patch in at least CHRYSALIS_BASE_URL and the
# auth settings. Every variable is listed in docs/DESIGN.md §11.
apiVersion: v1
kind: ConfigMap
metadata:
  name: chrysalis-config
data:
  CHRYSALIS_DATA_DIR: /data
  CHRYSALIS_LISTEN_ADDR: ":8080"
  CHRYSALIS_AUTH_MODE: oidc
  # The server backs itself up once a day into /data/backups, keeping 7 daily
  # and 4 weekly copies. It's already the volume's only writer, so this needs
  # no second pod on the ReadWriteOnce volume. To use a CronJob instead, add
  # ../../components/backup-cronjob to your overlay's components.
  CHRYSALIS_BACKUP_SCHEDULE: daily
